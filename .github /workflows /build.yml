name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install deps
      run: sudo apt update && sudo apt install -y git zip unzip python3-pip
    
    - name: Setup Android SDK 34
      uses: android-actions/setup-android@v3
    
    - name: Install SDK 34 + BuildTools 34
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
        yes | sdkmanager --licenses
    
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    
    - name: Build APK
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TUMA-V23.8
        path: bin/*.apk
