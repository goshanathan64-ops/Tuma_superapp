name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies for Kivy + pycairo
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip
        sudo apt install -y libcairo2-dev libgirepository1.0-dev libgl1-mesa-dev libgles2-mesa-dev libffi-dev libjpeg-dev zlib1g-dev pkg-config
    
    - name: Pre-install pycairo
      run: pip install pycairo==1.26.0
    
    - name: Setup Android SDK 34
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 25.2.9519653
    
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses
    
    - name: Install Buildozer + Cython
      run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    
    - name: Build TUMA APK
      run: buildozer android debug
    
    - uses: actions/upload-artifact@v4
      with:
        name: TUMA-V23.12-APK
        path: bin/*.apk
