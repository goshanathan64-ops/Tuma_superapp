name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libncursesw5-dev \
            libgdbm-dev \
            libnss3-dev \
            libxml2-dev \
            libxslt1-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libpng-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxml2-utils \
            curl \
            wget \
            libncurses5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==3.0.10" buildozer

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          buildozer --version
          buildozer android debug