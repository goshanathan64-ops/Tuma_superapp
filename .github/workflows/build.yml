name: Build TUMA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Java and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            git \
            zip \
            unzip \
            python3-pip \
            autoconf \
            libtool \
            pkg-config

      - name: Set Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33
          pip install virtualenv

      # ------------------------------------------------
      # Buildozer SDK directory
      # ------------------------------------------------
      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p /home/runner/.buildozer/android/platform

      # ------------------------------------------------
      # Build
      #
      # Buildozer will download its Android SDK.
      # --accept-sdk-license automatically accepts
      # Android SDK licenses.
      # ------------------------------------------------
      - name: Build TUMA
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          yes | buildozer android debug

      # ------------------------------------------------
      # Upload APK
      # ------------------------------------------------
      - name: Upload TUMA APK
        uses: actions/upload-artifact@v4
        with:
          name: TUMA-V23.13-APK
          path: bin/*.apk
          if-no-files-found: error