name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip ccache
          sudo apt install -y libcairo2-dev libgirepository1.0-dev libgl1-mesa-dev libffi-dev
      
      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 25.2.9519653
      
      - name: Accept Licenses
        run: yes | sdkmanager --licenses
      
      - name: Install p4a directly
        run: pip install python-for-android==2024.12.26 cython==0.29.33
      
      - name: Build APK with p4a
        run: |
          p4a apk --requirements=python3,kivy==2.3.0,kivymd==1.2.0 --package=org.tuma.tuma --name="TUMA" --version=1.0.0 --bootstrap=sdl2 --arch=arm64-v8a --sdk-dir ${ANDROID_HOME} --ndk-dir ${ANDROID_HOME}/ndk/25.2.9519653 --debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: TUMA-P4A-APK
          path: *.apk