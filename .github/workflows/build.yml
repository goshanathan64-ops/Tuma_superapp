name: Build TUMA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout TUMA
        uses: actions/checkout@v4


      # -------------------------
      # Python
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # -------------------------
      # Java + system packages
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config


      # -------------------------
      # Java 17
      # -------------------------
      - name: Configure Java 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          java -version


      # -------------------------
      # Buildozer
      # -------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install \
            buildozer==1.5.0 \
            cython==0.29.33 \
            virtualenv


      # -------------------------
      # Prepare Android SDK
      # -------------------------
      - name: Prepare Android SDK
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          mkdir -p "$SDK"


      # -------------------------
      # Buildozer initializes SDK
      # -------------------------
      - name: Initialize Buildozer
        run: |
          buildozer android debug


      # -------------------------
      # Accept licenses
      # -------------------------
      - name: Accept Android SDK licenses
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi


      # -------------------------
      # Install required SDK
      # -------------------------
      - name: Install Android API 34 and Build Tools 34
        run: |

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Installed Android packages:"
          "$SDKMANAGER" --list_installed


      # -------------------------
      # Build TUMA
      # -------------------------
      - name: Build TUMA Debug APK
        run: |

          yes | buildozer android debug


      # -------------------------
      # Upload APK
      # -------------------------
      - name: Upload TUMA APK
        uses: actions/upload-artifact@v4

        with:
          name: TUMA-V23.13-APK
          path: bin/*.apk
          if-no-files-found: error