name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system deps
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip pkg-config ccache
        sudo apt install -y libcairo2-dev libgirepository1.0-dev libgl1-mesa-dev
        sudo apt install -y libffi-dev libjpeg-dev zlib1g-dev libmtdev-dev
    
    - name: Setup Android SDK 34
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 25.2.9519653
    
    - name: Accept Licenses
      run: yes | sdkmanager --licenses
    
    - name: Install Python deps
      run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    
    - name: Build with Buildozer using System SDK
      run: |
        export ANDROID_HOME=${ANDROID_HOME}
        export ANDROID_SDK_ROOT=${ANDROID_HOME}
        buildozer android debug --sdk-path ${ANDROID_HOME} --ndk-path ${ANDROID_HOME}/ndk/25.2.9519653
    
    - uses: actions/upload-artifact@v4
      with:
        name: TUMA-FINAL-APK
        path: bin/*.apk