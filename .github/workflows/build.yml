name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip pkg-config
          sudo apt install -y libcairo2 libcairo2-dev libgirepository1.0-dev libgl1-mesa-dev libgles2-mesa-dev libffi-dev libjpeg-dev zlib1g-dev
          sudo apt install -y libmtdev-dev
      
      - name: Setup Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 25.2.9519653
      
      - name: Accept ALL Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
      
      - name: Install Buildozer + Cython
        run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
      
      - name: Create Buildozer SDK Folder + Symlink build-tools 34
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
          ln -s ${ANDROID_HOME}/build-tools/34.0.0 ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          ls -la ~/.buildozer/android/platform/android-sdk/build-tools/
      
      - name: Build TUMA APK
        run: buildozer android debug
        env:
          ANDROIDSDK: ${{ env.ANDROID_HOME }}
          ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
      
      - uses: actions/upload-artifact@v4
        with:
          name: TUMA-V23.17-APK
          path: bin/*.apk