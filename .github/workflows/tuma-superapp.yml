
name: Build TUMA APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system packages
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip
        sudo apt install -y libcairo2-dev libgirepository1.0-dev libgl1-mesa-dev libgles2-mesa-dev libffi-dev libjpeg-dev
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk-version: 25.2.9519653
    
    - name: Accept Licenses
      run: yes | sdkmanager --licenses
    
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    
    - name: Build TUMA Debug APK
      run: buildozer android debug
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
    
    - uses: actions/upload-artifact@v4
      with:
        name: TUMA-V23.10-APK
        path: bin/*.apk