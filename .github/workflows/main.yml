name: Build TUMA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Android Build Tools + NDK 25b
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
        
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
      
    - name: Build APK
      run: buildozer -v android debug
      env:
        PIP_DEFAULT_TIMEOUT: 1000
        PIP_RETRIES: 5
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tuma-apk
        path: bin/*.apk