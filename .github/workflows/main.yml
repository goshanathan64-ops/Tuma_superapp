name: Build TUMA APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          cython3 libssl-dev libffi-dev build-essential \
          pkg-config libjpeg-dev zlib1g-dev libncurses5-dev
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 31
        ndk-version: 25.2.9519653
    
    - name: Install Buildozer
      run: pip install --upgrade buildozer cython setuptools
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TUMA-SuperApp-V23.3
        path: bin/*.apk
    
    - name: Upload Build Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: .buildozer/android/platform/build-*/*.log
