name: Build TUMA APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: sudo apt update && sudo apt install -y git zip unzip openjdk-17-jdk python3-pip
      - name: Install Buildozer
        run: pip3 install buildozer cython==0.29.33 virtualenv
      - name: Build APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TUMA-debug-apk
          path: bin/*.apk