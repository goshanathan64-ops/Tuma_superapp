name: Build TUMA APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    
    - name: Install system deps
      run: sudo apt update && sudo apt install -y git zip unzip python3-pip
    
    - name: Install Android SDK 34
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
        unzip tools.zip
        mv cmdline-tools latest
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      env:
        ANDROID_HOME: $HOME/android-sdk
        PATH: $PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools
    
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
    
    - name: Build APK
      run: buildozer android debug
      env:
        ANDROID_HOME: $HOME/android-sdk
        ANDROIDSDK: $HOME/android-sdk
        ANDROIDNDK: $HOME/android-sdk/ndk/25b
        PATH: $PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools
    
    - uses: actions/upload-artifact@v4
      with: {name: TUMA-V23.5, path: bin/*.apk}