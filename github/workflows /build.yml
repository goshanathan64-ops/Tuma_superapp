name: Build TUMA APK
on:
  workflow_dispatch:

env:
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install deps
        run: sudo apt update && sudo apt install -y git zip unzip python3-pip wget
      
      - name: Setup Android SDK 34
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      
      - name: Install Buildozer
        run: pip install buildozer==1.5.0 cython==0.29.33 virtualenv
      
      - name: Build APK with API 34
        run: buildozer android debug
      
      - uses: actions/upload-artifact@v4
        with:
          name: TUMA-V23.6
          path: bin/*.apk
